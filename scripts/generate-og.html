<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0a0a0f 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    position: relative;
  }
  .og::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(196,167,125,0.10) 0%, transparent 60%);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(196,167,125,0.15);
    border: 1px solid rgba(196,167,125,0.35);
    border-radius: 999px;
    padding: 8px 16px;
    margin-bottom: 32px;
    position: relative;
    width: fit-content;
  }
  .badge-dot {
    width: 8px; height: 8px;
    background: #c4a77d;
    border-radius: 50%;
  }
  .badge-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c4a77d;
  }
  h1 {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 24px;
    position: relative;
  }
  h1 span { color: #c4a77d; font-style: italic; font-family: 'Playfair Display', serif; }
  .subtitle {
    font-size: 20px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    max-width: 700px;
    position: relative;
  }
  .stats {
    display: flex;
    gap: 48px;
    margin-top: 40px;
    position: relative;
  }
  .stat-num {
    font-size: 32px;
    font-weight: 800;
    color: #c4a77d;
  }
  .stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="og">
  <div class="badge">
    <div class="badge-dot"></div>
    <div class="badge-text">PropTech R&D & Product AI-Engineer</div>
  </div>
  <h1>Продуктовая разработка и <span>цифровизация строительства</span></h1>
  <div class="subtitle">Объединяю 7+ лет в строительной отрасли с продуктовым R&D. Без «испорченного телефона» между бизнесом и IT.</div>
  <div class="stats">
    <div>
      <div class="stat-num">4</div>
      <div class="stat-label">продукта в production</div>
    </div>
    <div>
      <div class="stat-num">~10</div>
      <div class="stat-label">прототипов за 1.5 года</div>
    </div>
    <div>
      <div class="stat-num">7+</div>
      <div class="stat-label">лет в строительстве</div>
    </div>
  </div>
</div>
</body>
</html>
